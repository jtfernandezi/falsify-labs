# Lab tools over stdio MCP, restricted to what this agent owns.
# The repo location comes from ~/.falsify-labs/root (written by scripts/setup.sh),
# so no machine-specific path is committed.
name: lab
transport: stdio
command: /bin/sh
args: ["-c", "cd \"$(cat \"$HOME/.falsify-labs/root\")\" && exec .venv/bin/python -m labmcp.server"]
tools:
  - dataset_summary
  - surrogate_error_by_family
  - test_prefilter
  - read_record
  - record_entry
